name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      # 覆盖 pyproject.toml 中的清华源配置：GitHub 海外服务器走官方源更稳定
      - name: Install dependencies
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv sync

      - name: Syntax check
        run: uv run python -m compileall -q app main.py

      - name: Build Docker image
        run: docker build --build-arg UV_INDEX_URL=https://pypi.org/simple -t smart-fitness-assistant .
